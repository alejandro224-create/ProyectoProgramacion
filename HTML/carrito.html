<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbiter - Carrito</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/carrito.css">
</head>
<body>
    <div class="app-layout">
        <!-- Barra Lateral Izquierda (Sidebar) -->
        <aside class="sidebar">
            <div class="sidebar-top">
                <div class="logo-box">
                    <img src="../SOURCES/logo-orbiter.png" alt="Orbiter" class="sidebar-logo">
                </div>

                <nav class="nav-menu">
                    <a href="home.html" class="nav-item">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z"/>
                        </svg>
                        <span>Inicio</span>
                    </a>

                    <a href="productos.html" class="nav-item">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path d="M12 3l9 4.5-9 4.5-9-4.5L12 3z"/>
                            <path d="M3 12l9 4.5 9-4.5"/>
                            <path d="M3 17l9 4.5 9-4.5"/>
                        </svg>
                        <span>Productos</span>
                    </a>

                    <a href="carrito.html" class="nav-item active">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <circle cx="9" cy="20" r="1.5"/>
                            <circle cx="18" cy="20" r="1.5"/>
                            <path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.8a1 1 0 0 0 1-.8L21 7H6"/>
                        </svg>
                        <span>Carrito</span>
                    </a>

                    <a href="#compras" class="nav-item">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z"/>
                            <line x1="9" y1="8" x2="15" y2="8"/>
                            <line x1="9" y1="12" x2="15" y2="12"/>
                        </svg>
                        <span>Compras</span>
                    </a>

                    <a href="#usuarios" class="nav-item">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                        <span>Usuarios</span>
                    </a>

                    <a href="#reportes" class="nav-item">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <line x1="6" y1="20" x2="6" y2="14"/>
                            <line x1="12" y1="20" x2="12" y2="9"/>
                            <line x1="18" y1="20" x2="18" y2="5"/>
                        </svg>
                        <span>Reportes</span>
                    </a>
                </nav>
            </div>

            <!-- Pie del Sidebar -->
            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <circle cx="12" cy="12" r="9"/>
                            <circle cx="12" cy="9.5" r="3"/>
                            <path d="M6.8 18.2a6.5 6.5 0 0 1 10.4 0"/>
                        </svg>
                    </div>
                    <div class="user-info">
                        <span class="user-email">Correo electrónico</span>
                        <span class="user-role">Administrador</span>
                    </div>
                </div>

                <a href="login.html" class="logout-btn" title="Cerrar sesión">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </a>
            </div>
        </aside>

        <!-- Contenido Principal -->
        <main class="main-content">
            <div class="page-header">
                <span class="eyebrow">TU SELECCIÓN</span>
                <h1 class="page-title">Carrito</h1>
                <p class="cart-subtitle" id="cart-subtitle">2 productos listos para ti</p>
            </div>

            <div class="cart-layout">
                <!-- Tarjeta Izquierda: Lista de Productos -->
                <section class="cart-items-card">
                    <div class="cart-card-header">
                        <h2 class="section-heading">Productos</h2>
                        <button type="button" class="btn-clear-cart" id="btn-clear-cart">Vaciar carrito</button>
                    </div>

                    <div class="cart-items-list" id="cart-items-list">
                        <!-- Elementos generados dinámicamente por JavaScript -->
                    </div>
                </section>

                <!-- Tarjeta Derecha: Resumen del Pedido -->
                <aside class="order-summary-card">
                    <span class="summary-eyebrow">RESUMEN</span>
                    <h2 class="summary-title">Tu pedido</h2>

                    <div class="summary-rows">
                        <div class="summary-row">
                            <span class="summary-label">Subtotal</span>
                            <span class="summary-value" id="summary-subtotal">$9,000.00</span>
                        </div>
                        <div class="summary-row">
                            <span class="summary-label">Envío</span>
                            <span class="summary-value free-shipping" id="summary-shipping">Gratis</span>
                        </div>
                        <div class="summary-row">
                            <span class="summary-label">Impuestos</span>
                            <span class="summary-value" id="summary-tax">$1,440.00</span>
                        </div>
                    </div>

                    <hr class="summary-divider">

                    <div class="summary-total-row">
                        <span class="total-label">Total</span>
                        <span class="total-value" id="summary-total">$10,440.00</span>
                    </div>

                    <button type="button" class="btn-confirm" id="btn-confirm-order">
                        <span>Confirmar compra</span>
                        <span class="arrow-icon">›</span>
                    </button>

                    <p class="feedback-msg" id="feedback-msg" role="status" aria-live="polite"></p>
                </aside>
            </div>
        </main>
    </div>

    <script src="../JS/orbiter-storage.js"></script>
    <script>
        let carrito = getCart();
        const TAX_RATE = 0.16;

        const cartItemsList = document.getElementById('cart-items-list');
        const cartSubtitle = document.getElementById('cart-subtitle');
        const subtotalEl = document.getElementById('summary-subtotal');
        const shippingEl = document.getElementById('summary-shipping');
        const taxEl = document.getElementById('summary-tax');
        const totalEl = document.getElementById('summary-total');
        const btnClearCart = document.getElementById('btn-clear-cart');
        const btnConfirmOrder = document.getElementById('btn-confirm-order');
        const feedbackMsg = document.getElementById('feedback-msg');

        function formatMoney(amount) {
            return '$' + Number(amount).toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function getMaxStockForItem(item) {
            const products = getProducts();
            const found = products.find(p => p.id === item.id);
            return found ? Number(found.stock) : Number(item.stock || 99);
        }

        function updateSummary() {
            const totalUnidades = carrito.reduce((acc, item) => acc + Number(item.cantidad), 0);
            const subtotal = carrito.reduce((acc, item) => acc + (Number(item.precioUnitario) * Number(item.cantidad)), 0);
            const envio = 0;
            const impuestos = subtotal * TAX_RATE;
            const total = subtotal + envio + impuestos;

            if (totalUnidades === 0) {
                cartSubtitle.textContent = '0 productos listos para ti';
            } else if (totalUnidades === 1) {
                cartSubtitle.textContent = '1 producto listo para ti';
            } else {
                cartSubtitle.textContent = `${totalUnidades} productos listos para ti`;
            }

            subtotalEl.textContent = formatMoney(subtotal);
            shippingEl.textContent = subtotal > 0 ? 'Gratis' : '$0.00';
            taxEl.textContent = formatMoney(impuestos);
            totalEl.textContent = formatMoney(total);

            btnConfirmOrder.disabled = carrito.length === 0;
            btnClearCart.disabled = carrito.length === 0;
        }

        function renderCart() {
            carrito = getCart();
            cartItemsList.innerHTML = '';

            if (carrito.length === 0) {
                cartItemsList.innerHTML = `
                    <div class="empty-cart">
                        <p>Tu carrito está vacío.</p>
                        <a href="home.html" class="empty-link">Explorar catálogo</a>
                    </div>
                `;
                updateSummary();
                return;
            }

            carrito.forEach(item => {
                const maxStock = getMaxStockForItem(item);
                const lineTotal = Number(item.precioUnitario) * Number(item.cantidad);
                const row = document.createElement('article');
                row.className = 'cart-item';
                row.innerHTML = `
                    <div class="item-thumb">
                        <img src="${item.imagen}" alt="${item.nombre}" onerror="this.style.display='none'">
                    </div>

                    <div class="item-details">
                        <span class="item-category">${item.categoria}</span>
                        <h3 class="item-name">${item.nombre}</h3>
                        ${getStockBadgeHTML(maxStock)}
                    </div>

                    <div class="qty-stepper" aria-label="Cantidad de ${item.nombre}">
                        <button 
                            type="button" 
                            class="qty-btn" 
                            onclick="changeQuantity(${item.id}, -1)" 
                            title="Disminuir cantidad"
                            aria-label="Disminuir cantidad de ${item.nombre}"
                        >−</button>
                        <span class="qty-value">${item.cantidad}</span>
                        <button 
                            type="button" 
                            class="qty-btn" 
                            onclick="changeQuantity(${item.id}, 1)" 
                            title="Aumentar cantidad"
                            aria-label="Aumentar cantidad de ${item.nombre}"
                            ${Number(item.cantidad) >= maxStock ? 'disabled' : ''}
                        >+</button>
                    </div>

                    <div class="item-price">${formatMoney(lineTotal)}</div>

                    <button 
                        type="button" 
                        class="delete-item-btn" 
                        onclick="removeItem(${item.id})" 
                        title="Eliminar producto"
                        aria-label="Eliminar ${item.nombre} del carrito"
                    >
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                            <path d="M10 11v6"/>
                            <path d="M14 11v6"/>
                            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                        </svg>
                    </button>
                `;
                cartItemsList.appendChild(row);
            });

            updateSummary();
        }

        function changeQuantity(id, delta) {
            feedbackMsg.textContent = '';
            const target = carrito.find(item => item.id === id);
            if (!target) return;

            const maxStock = getMaxStockForItem(target);
            const nextQty = Number(target.cantidad) + delta;

            if (nextQty <= 0) {
                removeItem(id);
                return;
            }

            if (nextQty > maxStock) {
                return;
            }

            target.cantidad = nextQty;
            saveCart(carrito);
            renderCart();
        }

        function removeItem(id) {
            feedbackMsg.textContent = '';
            carrito = carrito.filter(item => item.id !== id);
            saveCart(carrito);
            renderCart();
        }

        btnClearCart.addEventListener('click', () => {
            feedbackMsg.textContent = '';
            carrito = [];
            saveCart(carrito);
            renderCart();
        });

        btnConfirmOrder.addEventListener('click', () => {
            if (carrito.length === 0) return;

            const products = getProducts();
            const subtotal = carrito.reduce((acc, item) => acc + (Number(item.precioUnitario) * Number(item.cantidad)), 0);
            const impuestos = subtotal * TAX_RATE;
            const total = subtotal + impuestos;

            // Descontar stock en productos
            const updatedProducts = products.map(prod => {
                const inCart = carrito.find(c => c.id === prod.id);
                if (!inCart) return prod;
                return {
                    ...prod,
                    stock: Math.max(0, Number(prod.stock) - Number(inCart.cantidad))
                };
            });
            saveProducts(updatedProducts);

            // Guardar orden en historial de compras
            const orders = getOrders();
            orders.unshift({
                id: 'ORD-' + Date.now().toString().slice(-6),
                fecha: new Date().toLocaleString('es-MX'),
                items: JSON.parse(JSON.stringify(carrito)),
                subtotal,
                impuestos,
                total
            });
            saveOrders(orders);

            // Vaciar carrito
            carrito = [];
            saveCart(carrito);
            renderCart();
            feedbackMsg.textContent = 'Compra registrada en localStorage y stock actualizado.';
        });

        renderCart();
    </script>
</body>
</html>
